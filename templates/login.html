{% extends 'base.html' %}

{% block title %}Log In - PromptCraft Studio{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-card-accent"></div>
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to access your Prompt Engineering workspace.</p>
        </div>
        
        <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon-wrapper">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="email" name="email" placeholder="name@company.com" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-full btn-glow">
                <span>Sign In to Studio</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account yet? <a href="{{ url_for('auth.signup') }}" class="link-bold">Create account</a></p>
        </div>
    </div>
</div>
{% endblock %}
