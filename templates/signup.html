{% extends 'base.html' %}

{% block title %}Sign Up - PromptCraft Studio{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-card-accent"></div>
        <div class="auth-header">
            <h2>Create Studio Account</h2>
            <p class="auth-subtitle">Join PromptCraft Studio to engineer and validate LLM prompts.</p>
        </div>
        
        <form action="{{ url_for('auth.signup') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <div class="input-icon-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="full_name" name="full_name" placeholder="John Doe" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon-wrapper">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="email" name="email" placeholder="name@company.com" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-icon-wrapper">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-full btn-glow">
                <span>Create Workspace Account</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}" class="link-bold">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
